name: Tests
on: push
env:
  DOCKER_BUILDKIT: 1
  TZ: Europe/Helsinki

jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java 8
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        run: ./mvnw install -B
