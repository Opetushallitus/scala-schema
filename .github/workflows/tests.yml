name: Tests
on: push
env:
  DOCKER_BUILDKIT: 1
  TZ: Europe/Helsinki

jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 8
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        run: mvn install -B
