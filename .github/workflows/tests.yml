name: Tests
on: push
env:
  DOCKER_BUILDKIT: 1
  TZ: Europe/Helsinki

jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Java 8
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven

      - name: Run backend tests
        run: ./mvnw install -B
